<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索世界 | 你的专属旅行指南</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
        }

        /* 导航栏 */
        header {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 2rem;
        }

        nav ul li a {
            text-decoration: none;
            color: #555;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #e74c3c;
        }

        /* 顶部欢迎区 (Hero Section) */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .btn {
            padding: 10px 30px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1.1rem;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #c0392b;
        }

        /* 目的地推荐区 */
        .destinations {
            padding: 5rem 5%;
            background-color: #f9f9f9;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: #2c3e50;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .card-text {
            color: #666;
            margin-bottom: 15px;
        }

        /* 页脚 */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
        }

        /* 响应式设计（适配手机端） */
        @media (max-width: 768px) {
            nav ul {
                display: none; /* 移动端暂时隐藏菜单，可通过JS做汉堡菜单 */
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header>
        <a href="#" class="logo">✈️ 探索世界</a>
        <nav>
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#destinations">热门目的地</a></li>
                <li><a href="#">关于我们</a></li>
                <li><a href="#">联系客服</a></li>
            </ul>
        </nav>
    </header>

    <!-- 欢迎区 -->
    <section class="hero">
        <h1>发现世界的美好</h1>
        <p>放下繁杂的工作，背上行囊，和我们一起去探索那些鲜为人知的绝美风景，开启一段难忘的旅程。</p>
        <a href="#destinations" class="btn">开始探索</a>
    </section>

    <!-- 热门目的地 -->
    <section id="destinations" class="destinations">
        <h2 class="section-title">精选目的地</h2>
        <div class="grid">
            <!-- 目的地 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="巴黎">
                <div class="card-content">
                    <h3 class="card-title">法国，巴黎</h3>
                    <p class="card-text">漫步塞纳河畔，仰望埃菲尔铁塔，体验浪漫之都的无尽魅力与艺术气息。</p>
                    <a href="#" class="btn" style="padding: 5px 15px; font-size: 0.9rem;">查看详情</a>
                </div>
            </div>

            <!-- 目的地 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542051812871-7575015c058e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="京都">
                <div class="card-content">
                    <h3 class="card-title">日本，京都</h3>
                    <p class="card-text">穿梭于古色古香的神社与街道，在樱花与红叶中感受传统的宁静与美好。</p>
                    <a href="#" class="btn" style="padding: 5px 15px; font-size: 0.9rem;">查看详情</a>
                </div>
            </div>

            <!-- 目的地 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="巴厘岛">
                <div class="card-content">
                    <h3 class="card-title">印尼，巴厘岛</h3>
                    <p class="card-text">潜入湛蓝的海水，漫步洁白的沙滩，这里是完美的度假天堂。</p>
                    <a href="#" class="btn" style="padding: 5px 15px; font-size: 0.9rem;">查看详情</a>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 探索世界旅行网. All rights reserved.</p>
    </footer>

</body>
</html>
